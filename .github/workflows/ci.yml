name: Server CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/stacklink
      DIRECT_URL: postgresql://user:password@localhost:5432/stacklink
      JWT_SECRET: ci-only-stacklink-secret-with-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: stacklink
          POSTGRES_PASSWORD: stacklink
          POSTGRES_DB: stacklink_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stacklink"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://stacklink:stacklink@localhost:5432/stacklink_test
      DIRECT_URL: postgresql://stacklink:stacklink@localhost:5432/stacklink_test
      JWT_SECRET: ci-only-stacklink-secret-with-at-least-32-characters
      NODE_ENV: test
      FRONTEND_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prisma:migrate:deploy
      - run: npm run test:integration
